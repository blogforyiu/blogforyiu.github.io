<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>문의하기</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 40px 16px;
    }
    .page-wrapper {
      width: 100%;
      max-width: 900px;
    }
    .page-container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 22px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--card-border);
      margin-top: 20px;
      margin-bottom: 40px;
    }
    .page-container h2 {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
      margin-top: 0;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #e2e8f0;
    }
    .page-container p {
      font-size: 16px;
      line-height: 1.8;
      color: var(--text-sub);
      margin-bottom: 20px;
    }
    .email-box {
      background: #f8fafc;
      padding: 20px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      margin-top: 25px;
    }
    .top-nav {
      font-size: 14px;
      margin-bottom: 15px;
      font-weight: 600;
    }
    .top-nav a {
      color: var(--primary);
      text-decoration: none;
    }
    .top-nav a:hover {
      text-decoration: underline;
    }
    .top-nav span {
      color: var(--text-muted);
      margin: 0 6px;
    }
  </style>
</head>
<body>

<div class="page-wrapper">
  <div class="top-nav">
    <a href="index.html">홈</a><span>|</span>
    <a href="about.html">소개</a><span>|</span>
    <a href="privacy.html">개인정보처리방침</a><span>|</span>
    <a href="contact.html">문의하기</a>
  </div>
  
  <div class="page-container">
    <h2>문의하기</h2>
    <p>본 블로그와 관련하여 제휴 문의, 오류 제보, 기타 건의 사항이 있으신 분께서는 아래 이메일로 연락해 주시면 신속하게 확인 후 답변해 드리겠습니다.</p>
    
    <div class="email-box">
      <p style="margin:0; font-weight:700; color:var(--text-main);">📧 이메일 주소: <span style="color:var(--primary); font-weight:500;">yeonjun050727@gmail.com</span></p>
    </div>
  </div>
</div>

</body>
</html>
