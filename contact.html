<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>문의하기 - 에코 힐링 정보 커뮤니티</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- 눈누 메모먼트 꾹꾹체 웹폰트 CDN -->
  <link href="https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2204@1.0/MomentsKkugKkug.woff2" rel="stylesheet">

  <!-- Firebase SDK (1:1 문의 전송용) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'MomentsKkugKkug', 'Pretendard Variable', Pretendard, sans-serif !important;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 0;
    }
    .contact-container {
      max-width: 700px;
      margin: 40px auto;
      background: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }
    .contact-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .contact-title {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .contact-desc {
      font-size: 14px;
      color: #64748b;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #334155;
    }
    .form-input, .form-textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus, .form-textarea:focus {
      outline: none;
      border-color: #03c75a;
      box-shadow: 0 0 0 3px rgba(3, 199, 90, 0.15);
    }
    .form-textarea {
      height: 150px;
      resize: vertical;
    }
    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #03c75a;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, transform 0.1s;
    }
    .submit-btn:hover {
      background: #02b350;
    }
    .submit-btn:active {
      transform: scale(0.98);
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #64748b;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    .back-link:hover {
      color: #03c75a;
      text-decoration: underline;
    }
    #success-message {
      display: none;
      background: #f1fbf5;
      border: 1px solid #c6f6d5;
      color: #065f46;
      padding: 16px;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

<div class="contact-container">
  <div class="contact-header">
    <h1 class="contact-title">✉️️ 1:1 문의하기</h1>
    <p class="contact-desc">궁금한 점이나 제안사항을 남겨주시면 확인 후 빠르게 답변해 드리겠습니다.</p>
  </div>

  <div id="success-message">
    🎉 문의가 성공적으로 전송되었습니다! 소중한 의견 감사합니다.
  </div>

  <form id="contact-form" onsubmit="submitInquiry(event)">
    <div class="form-group">
      <label class="form-label" for="author">작성자 이름 / 닉네임</label>
      <input type="text" id="author" class="form-input" placeholder="이름을 입력해 주세요" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">답변 받을 이메일 (선택)</label>
      <input type="email" id="email" class="form-input" placeholder="example@email.com">
    </div>

    <div class="form-group">
      <label class="form-label" for="message">문의 내용</label>
      <textarea id="message" class="form-textarea" placeholder="궁금하신 내용을 상세히 적어주세요..." required></textarea>
    </div>

    <button type="submit" class="submit-btn" id="submit-btn-element">문의 내용 전송하기</button>
  </form>

  <a href="index.html" class="back-link">🏠 홈으로 돌아가기</a>
</div>

<script>
  // 파이어베이스 설정값 (기존과 동일)
  const firebaseConfig = {
    apiKey: "AIzaSyBR0wLEB88q2_aLBZPrdKFH27wxjHXsrIc",
    authDomain: "blog-visitor-87a5c.firebaseapp.com",
    projectId: "blog-visitor-87a5c",
    storageBucket: "blog-visitor-87a5c.appspot.com",
    messagingSenderId: "82038942165",
    appId: "1:82038942165:web:9772c7c77bd3f88393f56c"
  };

  // 파이어베이스 초기화
  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  function submitInquiry(event) {
    event.preventDefault();

    const author = document.getElementById('author').value.trim();
    const email = document.getElementById('email').value.trim();
    const message = document.getElementById('message').value.trim();
    const btn = document.getElementById('submit-btn-element');

    btn.disabled = true;
    btn.innerText = "전송 중...";

    // 파이어베이스 'inquiries' 컬렉션에 문의글 저장
    db.collection("inquiries").add({
      author: author,
      email: email || "미입력",
      message: message,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    })
    .then(() => {
      document.getElementById('contact-form').style.display = 'none';
      document.getElementById('success-message').style.display = 'block';
    })
    .catch((error) => {
      console.error("문의 전송 실패:", error);
      alert("전송 중 오류가 발생했습니다. 다시 시도해 주세요.");
      btn.disabled = false;
      btn.innerText = "문의 내용 전송하기";
    });
  }
</script>

</body>
</html>
