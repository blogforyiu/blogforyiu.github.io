<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>1:1 문의하기 - ECO & TECH</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
</head>
<body>

<!-- 상단 미니멀 네비게이션 헤더 -->
<header class="site-header">
  <a href="index.html" class="site-logo">ECO & TECH</a>
  <nav class="site-nav">
    <a href="index.html">홈</a>
    <a href="about.html">소개</a>
    <a href="privacy.html">개인정보처리방침</a>
    <a href="contact.html" style="color: var(--primary); font-weight: 800;">문의하기</a>
  </nav>
</header>

<div class="contact-container">
  <a href="index.html" class="back-home-link">← 홈으로 돌아가기</a>
  <h1 class="contact-title">✉️ 1:1 문의하기</h1>
  <p style="color: var(--text-sub); margin-bottom: 30px; font-size: 15px;">궁금하신 점이나 제안사항을 남겨주시면 확인 후 빠르게 답변해 드리겠습니다.</p>

  <form onsubmit="event.preventDefault(); alert('문의가 정상적으로 접수되었습니다. 감사합니다!'); location.href='index.html';">
    <div class="form-group">
      <label class="form-label">작성자 이름 / 닉네임</label>
      <input type="text" class="form-input" placeholder="이름을 입력해 주세요" required>
    </div>

    <div class="form-group">
      <label class="form-label">답변 받을 이메일 (선택)</label>
      <input type="email" class="form-input" placeholder="example@email.com">
    </div>

    <div class="form-group">
      <label class="form-label">문의 내용</label>
      <textarea class="form-textarea" placeholder="궁금하신 내용을 상세히 적어주세요..." required></textarea>
    </div>

    <button type="submit" class="submit-btn">문의 내용 전송하기</button>
  </form>
</div>

</body>
</html>
