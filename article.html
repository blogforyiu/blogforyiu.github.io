<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>포스트 상세</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 40px 16px;
    }
    .article-wrapper {
      width: 100%;
      max-width: 900px;
    }
    .article-container { 
      background: var(--card-bg); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 40px; 
      border-radius: 22px; 
      box-shadow: var(--shadow-md); 
      border: 1px solid var(--card-border);
      margin-bottom: 30px; 
    }
    .article-title { 
      font-size: 30px; 
      font-weight: 800; 
      color: var(--text-main); 
      margin-bottom: 15px; 
      line-height: 1.3; 
    }
    .article-meta { 
      font-size: 14px; 
      color: var(--text-muted); 
      margin-bottom: 30px; 
      padding-bottom: 15px; 
      border-bottom: 1px solid #e2e8f0; 
    }
    .article-body { 
      font-size: 16px; 
      line-height: 1.8; 
      color: var(--text-sub); 
    }
    .article-body h2 { 
      font-size: 22px; 
      margin-top: 35px; 
      margin-bottom: 15px; 
      color: var(--text-main); 
    }
    .article-body p { 
      margin-bottom: 20px; 
    }
    .article-body ul, .article-body ol { 
      margin-bottom: 20px; 
      padding-left: 20px; 
    }
    .article-body li { 
      margin-bottom: 8px; 
    }
    .back-btn { 
      display: inline-block; 
      margin-bottom: 20px; 
      background: var(--primary); 
      color: #fff; 
      padding: 10px 20px; 
      border-radius: 10px; 
      text-decoration: none; 
      font-weight: 600; 
      transition: background 0.2s;
    }
    .back-btn:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

<div class="article-wrapper">
  <a href="index.html" class="back-btn">← 홈으로 돌아가기</a>
  <article class="article-container" id="article-box">
    <div style="text-align: center; padding: 50px; color: var(--text-muted);">글을 불러오는 중입니다...</div>
  </article>
</div>

<script src="data.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const postId = parseInt(urlParams.get('id'));
  const articleBox = document.getElementById('article-box');

  if (typeof posts !== 'undefined') {
    const post = posts.find(p => p.id === postId);
    if (post) {
      document.title = post.title;
      articleBox.innerHTML = `
        <div style="font-size: 13px; color: var(--primary); font-weight: 700; margin-bottom: 8px;">${post.category}</div>
        <h1 class="article-title">${post.title}</h1>
        <div class="article-meta">작성일: ${post.date}</div>
        <div class="article-body">${post.content}</div>
      `;
    } else {
      articleBox.innerHTML = '<h2>존재하지 않는 포스트입니다.</h2><p><a href="index.html">홈으로 가기</a></p>';
    }
  }
</script>
</body>
</html>
