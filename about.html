<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>블로그 소개</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 40px 16px;
    }
    .page-wrapper {
      width: 100%;
      max-width: 900px;
    }
    .page-container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 22px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--card-border);
      margin-top: 20px;
      margin-bottom: 40px;
    }
    .page-container h2 {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-main);
      margin-top: 0;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #e2e8f0;
    }
    .page-container p {
      font-size: 16px;
      line-height: 1.8;
      color: var(--text-sub);
      margin-bottom: 20px;
    }
    .top-nav {
      font-size: 14px;
      margin-bottom: 15px;
      font-weight: 600;
    }
    .top-nav a {
      color: var(--primary);
      text-decoration: none;
    }
    .top-nav a:hover {
      text-decoration: underline;
    }
    .top-nav a.current {
      color: var(--text-main);
      font-weight: 700;
      pointer-events: none;
    }
    .top-nav span {
      color: var(--text-muted);
      margin: 0 6px;
    }
    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      background: var(--primary);
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    .back-btn:hover {
      background: var(--primary-hover);
    }
  </style>
</head>
<body>

<div class="page-wrapper">
  <div class="top-nav">
    <a href="index.html">홈</a><span>|</span>
    <a href="about.html" class="current">소개</a><span>|</span>
    <a href="privacy.html">개인정보처리방침</a><span>|</span>
    <a href="contact.html">문의하기</a>
  </div>
  
  <a href="index.html" class="back-btn">← 홈으로</a>

  <div class="page-container">
    <h2>블로그 소개</h2>
    <p>안녕하세요! 본 블로그는 생활 속 유용한 꿀팁, 금융 및 테크 트렌드, IT 스마트폰 활용법 등 독자분들께 꼭 필요한 알짜배기 정보를 전달하기 위해 운영되고 있습니다.</p>
    <p>정확하고 신뢰할 수 있는 정보를 바탕으로 매일 성장하는 블로그가 되겠습니다. 감사합니다.</p>
  </div>
</div>

</body>
</html>
