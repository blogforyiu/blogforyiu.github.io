<body>

<!-- 🌟 상단 미니멀 네비게이션 헤더 -->
<header class="site-header">
  <a href="index.html" class="site-logo">ECO & TECH</a>
  <nav class="site-nav">
    <a href="about.html">블로그 소개</a>
    <a href="privacy.html">개인정보처리방침</a>
    <a href="contact.html">1:1 문의</a>
  </nav>
</header>

<div class="wrapper" style="display: block; max-width: 1280px; margin: 40px auto; padding: 0 24px;">

  <!-- 🌿 와이드 감성 히어로 섹션 -->
  <div class="hero-banner-grid" style="margin-bottom: 50px;">
    <div class="hero-text-side">
      <div class="hero-subtitle-tag">ECO HEALING COMMUNITY</div>
      <h1 class="hero-main-title">일상을 바꾸는 스마트한 힐링과 테크 정보</h1>
      <p class="hero-desc">매일 업데이트되는 알찬 생활 꿀팁과 유용한 IT 정보를 가장 감각적인 레이아웃으로 만나보세요.</p>
    </div>
    <div class="hero-img-side">
      <img src="https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=1000&q=80" alt="감성 데스크 셋업">
    </div>
  </div>

  <!-- ⭐ 오늘의 추천 글 (매일 자동으로 변경) -->
  <div class="blog-section">
    <div class="blog-header">
      <h2 class="blog-title">⭐ 오늘의 추천 글</h2>
    </div>
    <div class="post-list-scroll" id="today-recommend-container">
      <!-- 자바스크립트로 매일 다른 포스트 4개가 동적으로 채워집니다 -->
    </div>
  </div>

  <!-- 카테고리별 포스트 목록 영역 -->
  <div class="blog-section" id="posts-lifestyle">
    <div class="blog-header"><h2 class="blog-title">생활 / 꿀팁 모음</h2></div>
    <div class="post-list-scroll" id="list-lifestyle"></div>
  </div>

  <div class="blog-section" id="posts-finance">
    <div class="blog-header"><h2 class="blog-title">금융 / 테크 정보</h2></div>
    <div class="post-list-scroll" id="list-finance"></div>
  </div>

  <div class="blog-section" id="posts-it">
    <div class="blog-header"><h2 class="blog-title">IT / 스마트폰</h2></div>
    <div class="post-list-scroll" id="list-it"></div>
  </div>

  <div class="blog-section" id="posts-travel">
    <div class="blog-header"><h2 class="blog-title">여행 / 맛집 탐방</h2></div>
    <div class="post-list-scroll" id="list-travel"></div>
  </div>

</div>

<script src="data.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBR0wLEB88q2_aLBZPrdKFH27wxjHXsrIc",
    authDomain: "blog-visitor-87a5c.firebaseapp.com",
    projectId: "blog-visitor-87a5c",
    storageBucket: "blog-visitor-87a5c.appspot.com",
    messagingSenderId: "82038942165",
    appId: "1:82038942165:web:9772c7c77bd3f88393f56c"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  window.onload = function() {
    renderPostsToDOM();
    renderTodayRecommendations(); // 페이지 로드 시 오늘의 추천 글 렌더링
  };

  // 🔄 매일 자정마다 포스트 ID 그룹을 순환하며 보여주는 함수
  function renderTodayRecommendations() {
    if (typeof posts === 'undefined') return;

    // 현재 보유하신 포스트 ID(1~22)들을 활용한 추천 그룹 세트
    const recommendationGroups = [
      [1, 15, 16, 17],
      [18, 19, 20, 21],
      [2, 5, 8, 22]
    ];

    const today = new Date();
    const dateKey = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
    const groupIndex = dateKey % recommendationGroups.length;
    const targetIds = recommendationGroups[groupIndex];

    const container = document.getElementById('today-recommend-container');
    if (!container) return;
    container.innerHTML = '';

    targetIds.forEach(id => {
      const post = posts.find(p => p.id === id);
      if (post) {
        const card = document.createElement('a');
        card.className = 'post-card-mini';
        card.href = `article.html?id=${post.id}`;
        card.innerHTML = `
          <div class="post-thumb-wrapper-mini">
            <img class="post-thumb-mini" src="${post.thumb}" alt="썸네일" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3959/3959542.png'">
          </div>
          <div class="post-content-mini">
            <div class="post-title-mini" title="${post.title}">${post.title}</div>
            <div class="post-date-mini">${post.date}</div>
          </div>
        `;
        container.appendChild(card);
      }
    });
  }

  function renderPostsToDOM() {
    if (typeof posts === 'undefined') return;
    const lifestyleEl = document.getElementById('list-lifestyle');
    const financeEl = document.getElementById('list-finance');
    const itEl = document.getElementById('list-it');
    const travelEl = document.getElementById('list-travel');

    posts.forEach(post => {
      const card = document.createElement('a');
      card.className = 'post-card-mini';
      card.href = `article.html?id=${post.id}`;
      card.innerHTML = `
        <div class="post-thumb-wrapper-mini">
          <img class="post-thumb-mini" src="${post.thumb}" alt="썸네일" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3959/3959542.png'">
        </div>
        <div class="post-content-mini">
          <div class="post-title-mini" title="${post.title}">${post.title}</div>
          <div class="post-date-mini">${post.date}</div>
        </div>
      `;
      
      const cat = post.category.replace(/\s+/g, '');
      if (cat.includes('생활') || cat.includes('꿀팁')) {
        lifestyleEl?.appendChild(card);
      } else if (cat.includes('금융') || cat.includes('테크')) {
        financeEl?.appendChild(card);
      } else if (cat.includes('IT') || cat.includes('스마트폰')) {
        itEl?.appendChild(card);
      } else {
        travelEl?.appendChild(card);
      }
    });
  }
</script>
</body>
</html>
