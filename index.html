<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 블로그 메인</title>

    <!-- 구글 애드센스 코드 -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1967645240354790"
         crossorigin="anonymous"></script>

    <!-- 디자인용 CSS 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>블로그 홈</h1>
    </header>

    <!-- 글 목록이 생성될 그리드 영역 -->
    <main class="grid-container" id="cardGrid"></main>

    <footer>
        <!-- 애드센스 필수 승인 요건: 정책 페이지 실제 링크 연결 -->
        <a href="privacy.html">개인정보처리방침</a> | 
        <a href="about.html">소개</a> | 
        <a href="contact.html">문의하기</a>
    </footer>

    <!-- 공통 데이터와 메인 페이지 스크립트 로드 (캐시 방지 ?v=2 적용) -->
    <script src="data.js?v=2"></script>
    <script>
        const grid = document.getElementById('cardGrid');

        posts.forEach(post => {
            // SEO 향상을 위해 a 태그 사용
            const cardLink = document.createElement('a');
            cardLink.href = `article.html?id=${post.id}`;
            cardLink.className = 'post-card-link'; 
            cardLink.style.textDecoration = 'none'; // 기본 링크 밑줄 제거
            cardLink.style.color = 'inherit';

            cardLink.innerHTML = `
                <article class="post-card">
                    <div class="thumb-wrapper">
                        <img src="${post.thumb}" alt="${post.title}" class="thumb-img" loading="lazy"
                             onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=800&q=80';">
                    </div>
                    <div class="card-body-preview">
                        <div class="card-meta">
                            <span class="category-badge">${post.category}</span>
                            <span class="post-date">${post.date}</span>
                        </div>
                        <h2 class="post-title">${post.title}</h2>
                        <p class="post-snippet">${post.snippet}</p>
                        <div class="read-more-link">본문 읽기 ➔</div>
                    </div>
                </article>
            `;
            grid.appendChild(cardLink);
        });
    </script>
</body>
</html>
