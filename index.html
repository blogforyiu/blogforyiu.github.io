<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECO & TECH - Official Store</title>
  <link rel="stylesheet" href="style.css?v=13">
  
  <style>
    @font-face {
      font-family: 'MomentsKkugKkug';
      src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2204@1.0/MomentsKkugKkug.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<!-- 상단 네비게이션 헤더 -->
<header class="site-header" id="siteHeader">
  <a href="index.html" class="site-logo">ECO & TECH</a>
  <nav class="site-nav">
    <a href="#" onclick="filterCategory('전체', event)" class="active-cat">ALL</a>
    <a href="#" onclick="filterCategory('IT/스마트폰', event)">IT / Tech</a>
    <a href="#" onclick="filterCategory('생활/꿀팁', event)">Life / Tips</a>
    <a href="#" onclick="filterCategory('여행/맛집', event)">Travel / Food</a>
    <a href="#" onclick="filterCategory('금융/테크', event)">Finance</a>
  </nav>
  <div class="header-right-menu">
    <a href="about.html">About</a>
    <a href="privacy.html">Privacy</a>
    <a href="contact.html">Contact</a>
  </div>
</header>

<!-- 풀 와이드 히어로 배너 섹션 (FEATURED 감성 연동) -->
<section class="adidas-hero-section">
  <div class="hero-grid" id="hero-grid-container">
    <div style="grid-column: 1/-1; padding: 60px; text-align: center; color: #fff;">인기 포스트를 불러오는 중입니다...</div>
  </div>
</section>

<!-- 전체 아티클 목록 섹션 -->
<main class="main-container">
  <div class="section-title-area">
    <h2 id="current-category-title">ALL POSTS</h2>
  </div>
  <div class="post-grid" id="post-grid-container"></div>
</main>

<script src="data.js"></script>
<script>
  // Firebase 초기화
  const firebaseConfig = {
    apiKey: "AIzaSyBR0wLEB88q2_aLBZPrdKFH27wxjHXsrIc",
    authDomain: "blog-visitor-87a5c.firebaseapp.com",
    projectId: "blog-visitor-87a5c",
    storageBucket: "blog-visitor-87a5c.appspot.com",
    messagingSenderId: "82038942165",
    appId: "1:82038942165:web:9772c7c77bd3f88393f56c"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.firestore();

  let lastScrollTop = 0;
  const header = document.getElementById('siteHeader');

  window.addEventListener('scroll', function() {
    let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
    if (scrollTop > lastScrollTop && scrollTop > 100) {
      header.classList.add('header-hidden');
    } else {
      header.classList.remove('header-hidden');
    }
    lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
  }, false);

  let postViewsMap = {};

  window.onload = async function() {
    if (typeof posts === 'undefined' || posts.length === 0) {
      document.getElementById('hero-grid-container').innerHTML = '<p style="padding:40px; text-align:center; color:#fff;">게시글을 불러올 수 없습니다.</p>';
      return;
    }

    try {
      const snapshot = await db.collection("article_views").get();
      snapshot.forEach(doc => {
        postViewsMap[doc.id] = doc.data().views || 0;
      });
    } catch (e) {
      console.log("조회수 불러오기 실패");
    }

    filterCategory('전체');
  };

  function filterCategory(categoryName, event) {
    if(event) event.preventDefault();
    
    document.querySelectorAll('.site-nav a').forEach(el => {
      el.classList.remove('active-cat');
      el.style.color = '#000';
    });
    if(event) {
      event.target.classList.add('active-cat');
      event.target.style.color = '#ff5722';
    }

    document.getElementById('current-category-title').innerText = categoryName === '전체' ? 'ALL POSTS' : categoryName;
    
    let targetPosts = posts;
    if (categoryName !== '전체') {
      targetPosts = posts.filter(p => p.category === categoryName);
    }

    // 하단 목록은 최신순 정렬
    let listSorted = [...targetPosts].sort((a, b) => b.id - a.id);
    renderPosts(listSorted);

    // 상단 히어로 배너는 조회수 높은 순 정렬
    let heroSorted = [...targetPosts].sort((a, b) => {
      let viewsA = postViewsMap[String(a.id)] || 0;
      let viewsB = postViewsMap[String(b.id)] || 0;
      return viewsB - viewsA;
    });
    renderHero(heroSorted);
  }

  function renderHero(targetPosts) {
    const heroContainer = document.getElementById('hero-grid-container');
    
    if (!targetPosts || targetPosts.length === 0) {
      heroContainer.innerHTML = '<div style="grid-column: 1/-1; padding: 40px; text-align: center; color: #fff;">해당 카테고리에 표시할 배너 게시물이 없습니다.</div>';
      return;
    }

    let heroHTML = '';
    const heroPosts = targetPosts.slice(0, 3);
    
    heroPosts.forEach((post) => {
      const imgMatch = post.content.match(/<img[^>]+src="([^">]+)"/);
      const imgSrc = imgMatch ? imgMatch[1] : 'https://images.unsplash.com/photo-1515955656352-a1fa3ffcd111?auto=format&fit=crop&w=800&q=80';
      const views = postViewsMap[String(post.id)] || 0;
      
      heroHTML += `
        <div class="hero-card" onclick="location.href='article.html?id=${post.id}'">
          <img src="${imgSrc}" alt="${post.title}" loading="lazy">
          <div class="hero-card-content">
            <span class="hero-badge">FEATURED ㆍ ${views} VIEWS</span>
            <h3>${post.title}</h3>
            <span class="hero-link">DISCOVER MORE →</span>
          </div>
        </div>
      `;
    });
    heroContainer.innerHTML = heroHTML;
  }

  function renderPosts(targetPosts) {
    const postContainer = document.getElementById('post-grid-container');

    if (!targetPosts || targetPosts.length === 0) {
      postContainer.innerHTML = '<p style="padding: 40px; color: #767677; grid-column: 1/-1;">해당 카테고리에 등록된 포스트가 없습니다.</p>';
      return;
    }

    let listHTML = '';
    targetPosts.forEach(post => {
      const imgMatch = post.content.match(/<img[^>]+src="([^">]+)"/);
      const imgSrc = imgMatch ? imgMatch[1] : 'https://images.unsplash.com/photo-1515955656352-a1fa3ffcd111?auto=format&fit=crop&w=800&q=80';

      listHTML += `
        <div class="post-card" onclick="location.href='article.html?id=${post.id}'">
          <div class="post-card-img">
            <img src="${imgSrc}" alt="${post.title}" loading="lazy">
          </div>
          <div class="post-card-body">
            <span class="post-category">${post.category || 'STORY'}</span>
            <h4 class="post-title">${post.title}</h4>
            <span class="post-date">${post.date}</span>
          </div>
        </div>
      `;
    });
    postContainer.innerHTML = listHTML;
  }
</script>

</body>
</html>
